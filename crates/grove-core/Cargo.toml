# For `O_NOFOLLOW` in `securefs`. A constant, so it cannot be declared as an
# extern the way this workspace declares `geteuid`/`setuid` — and hardcoding the
# per-platform value would be a silent portability bug. `libc` is a bindings
# crate with no C code, already in the lockfile transitively.
libc = "0.2"

