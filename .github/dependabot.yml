version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # `e-db` is a git dependency on a repo we also own, pinned to a rev in the
      # workspace Cargo.toml. Dependabot bumps git revs like any other version,
      # which would undo that pin every week — and a grouped update means one bad
      # e-db commit fails the whole cargo PR. It already nearly did: e-db 0.9.13
      # added `keyring`, which on Linux pulls `libdbus-sys` (needs
      # `libdbus-1-dev` to build, and a D-Bus session bus at runtime that a
      # headless Grove daemon has not got).
      #
      # Bump it by hand instead: move the rev, then check `cargo tree` for new
      # system-library dependencies. Drop this entry once e-db puts `keyring`
      # behind an optional feature.
      - dependency-name: "e-db"

  - package-ecosystem: npm
    directory: "/crates/grove-gui/ui"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # TypeScript 7 is the Go port, and it cannot be adopted by bumping a
      # version: it wants *both* TS 7 and TS 6 installed plus a `--tsgo` flag,
      # and `svelte-check` does not drive it yet. Grouped updates meant this one
      # package failed the whole npm PR every week. Drop this entry once
      # svelte-check supports tsgo.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
