name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        # The GUI crate needs the Tauri toolchain; it is linted in the `gui` job.
        run: cargo clippy --workspace --exclude grove-gui --all-targets -- -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    env:
      # Keep in step with `rust-version` in the workspace Cargo.toml.
      # Not interpolated into the job's `name`: the `env` context is not
      # available there, and a workflow that references it fails to load at all.
      MSRV: "1.94"
    steps:
      - uses: actions/checkout@v4
      # Every other job uses `stable`, which is always new enough — so a
      # dependency bump can raise the real minimum without anything noticing,
      # and the manifest, the README badge and CONTRIBUTING quietly start
      # lying. That is exactly what happened over 1.4.0: the declared minimum
      # said 1.80 while sqlx 0.9 had moved it to 1.94, and building on the
      # documented version failed with an `edition2024` error from a transitive
      # dependency rather than anything that named the cause.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ env.MSRV }}
      - name: Verify the declared minimum still builds
        run: cargo check --workspace --exclude grove-gui --all-targets

  test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --exclude grove-gui --verbose
      - name: Test
        run: cargo test --workspace --exclude grove-gui --verbose

  frontend:
    name: Frontend (Svelte)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/grove-gui/ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: crates/grove-gui/ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Type-check & build
        run: pnpm run build

  gui:
    name: GUI (Tauri)
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: crates/grove-gui/ui/pnpm-lock.yaml
      - name: Build frontend (required by tauri-build)
        working-directory: crates/grove-gui/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Clippy (GUI)
        run: cargo clippy -p grove-gui --all-targets -- -D warnings
