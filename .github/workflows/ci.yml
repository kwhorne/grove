name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        # The GUI crate needs the Tauri toolchain; it is linted in the `gui` job.
        run: cargo clippy --workspace --exclude grove-gui --all-targets -- -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    env:
      # Keep in step with `rust-version` in the workspace Cargo.toml.
      # Not interpolated into the job's `name`: the `env` context is not
      # available there, and a workflow that references it fails to load at all.
      MSRV: "1.94"
    steps:
      - uses: actions/checkout@v4
      # Every other job uses `stable`, which is always new enough — so a
      # dependency bump can raise the real minimum without anything noticing,
      # and the manifest, the README badge and CONTRIBUTING quietly start
      # lying. That is exactly what happened over 1.4.0: the declared minimum
      # said 1.80 while sqlx 0.9 had moved it to 1.94, and building on the
      # documented version failed with an `edition2024` error from a transitive
      # dependency rather than anything that named the cause.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ env.MSRV }}
      - name: Verify the declared minimum still builds
        run: cargo check --workspace --exclude grove-gui --all-targets

  test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --exclude grove-gui --verbose
      - name: Test
        run: cargo test --workspace --exclude grove-gui --verbose

  frontend:
    name: Frontend (Svelte)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/grove-gui/ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: crates/grove-gui/ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Type-check & build
        run: pnpm run build

  gui:
    name: GUI (Tauri)
    env:
      HAS_PRO_KEY: ${{ secrets.GROVE_PRO_SSH_KEY != '' }}
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: crates/grove-gui/ui/pnpm-lock.yaml
      - name: Build frontend (required by tauri-build)
        working-directory: crates/grove-gui/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      # The proprietary grove-pro is cloned in only at release time, so the
      # open-source CI never compiled the GUI against it — which is how a
      # dependency it declared differently from the workspace reached the
      # release build and nowhere before (v1.5.0: eight E0308s, two attempts).
      # When the deploy key is available (not on forks), build what release
      # builds. The step is skipped, not failed, without it.
      - name: Inject Grove Pro (proprietary), when the key is available
        if: ${{ env.HAS_PRO_KEY == 'true' }}
        env:
          GROVE_PRO_SSH_KEY: ${{ secrets.GROVE_PRO_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$GROVE_PRO_SSH_KEY" > ~/.ssh/grove_pro
          chmod 600 ~/.ssh/grove_pro
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/grove_pro -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"
          rm -rf crates/grove-pro
          git clone --depth 1 git@github.com:kwhorne/grove-pro.git crates/grove-pro
          rm -rf crates/grove-pro/.git ~/.ssh/grove_pro
          echo "Injected proprietary grove-pro."
          bad=$(grep -nE '^[a-zA-Z0-9_-]+ *= *\{[^}]*git *=' crates/grove-pro/Cargo.toml || true)
          if [ -n "$bad" ]; then
            echo "::error::grove-pro declares a git dependency directly (use <dep>.workspace = true):"
            echo "$bad"; exit 1
          fi
      - name: Clippy (GUI)
        run: cargo clippy -p grove-gui --all-targets -- -D warnings
