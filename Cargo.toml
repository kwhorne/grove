[workspace]
resolver = "2"
members = [
    "crates/grove-core",
    "crates/grove-ipc",
    "crates/grove-tls",
    "crates/grove-dns",
    "crates/grove-proxy",
    "crates/grove-tunnel",
    "crates/grove-runtime",
    "crates/grove-services",
    "crates/grove-secrets",
    "crates/grove-license",
    "crates/grove-pro",
    "crates/grove-os",
    "crates/grove-daemon",
    "crates/grove-cli",
    "crates/grove-gui",
]

[workspace.package]
version = "1.4.2"
edition = "2021"
license = "MIT"
authors = ["Knut / Wirelabs AS"]
repository = "https://github.com/wirelabs/grove"
rust-version = "1.94"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# Errors
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Database schema/query engine shared with the `e` editor (Laravel .env aware).
#
# Pinned to a rev, and declared here rather than in each member, on purpose.
# It is a git dependency on a repo we also own, so an unpinned `git = ` lets any
# commit there land in Grove's lockfile on the next `cargo update` — which is
# exactly how e-db 0.9.13's new `keyring` dependency nearly arrived: on Linux it
# pulls `dbus-secret-service` → `libdbus-sys`, needs `libdbus-1-dev` to build,
# and wants a D-Bus session bus at runtime that a headless Grove daemon does not
# have. Grove only uses e-db's schema/query API and reads credentials from the
# project's own .env, so it never needs a credential store.
#
# Moving this rev is a deliberate step: bump it, then check `cargo tree` for new
# system-library dependencies before committing the lockfile.
e-db = { git = "https://github.com/kwhorne/e.git", rev = "d6af91f0be8f716ff5303b4d9d739ca790bdd6b9" }

# Paths
directories = "6"
dirs = "5"

# Networking / HTTP
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1"

# DNS
hickory-server = "0.26"
hickory-proto = "0.26"

# TLS (pin to the `ring` crypto provider to avoid a C/cmake toolchain dep)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "x509-parser"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

# Tunnel multiplexing (pure Rust, no C toolchain)
tokio-yamux = "0.3"

# Misc
shellexpand = "3"
once_cell = "1"
time = { version = "0.3", features = ["formatting", "macros"] }

[profile.release]
# `lto = "fat"` + one codegen unit claws back most of the size that moving off
# `opt-level = "z"` costs, so the shipped binary stays small.
lto = "fat"
codegen-units = 1
strip = true
# Grove is a long-running proxy on the request path: it terminates TLS, speaks
# FastCGI and copies bodies for every request on every site. `opt-level = "z"`
# optimises the one thing that does not matter here — a few hundred KiB of
# binary — at the cost of the thing that does, so throughput and latency are
# measurably worse for no user-visible gain.
opt-level = 3
# Deliberately *not* `panic = "abort"`. With abort, a panic anywhere — one
# poisoned mutex, one arithmetic edge case in a single request — takes the whole
# daemon down and with it DNS, TLS and every other site. Unwinding keeps a panic
# inside the tokio task that caused it: that one request fails, everything else
# keeps serving.
